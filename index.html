<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHANNEL 13</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:monospace;
}

#room{
    width:100%;
    height:100%;
    position:relative;
    background:
        linear-gradient(#181818 0 70%,#0c0c0c 70%);
}

#floor{
    position:absolute;
    bottom:0;
    width:100%;
    height:30%;
    background:
        repeating-linear-gradient(
            90deg,
            #111 0px,
            #111 90px,
            #0b0b0b 91px,
            #0b0b0b 180px
        );
}

/* TV */

#tv{
    position:absolute;
    width:min(850px,90vw);
    height:min(510px,60vh);
    left:50%;
    top:7%;
    transform:translateX(-50%);
    background:#202020;
    border:20px solid #151515;
    border-radius:20px;
    box-shadow:
        0 25px 60px #000,
        inset 0 0 0 4px #383838;
}

#screen{
    position:absolute;
    inset:12px;
    background:black;
    overflow:hidden;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );
}

#channelNumber{
    position:absolute;
    right:10px;
    top:8px;
    background:rgba(0,0,0,.65);
    padding:4px 7px;
    font-size:18px;
}

#channelName{
    position:absolute;
    left:10px;
    top:8px;
    background:rgba(0,0,0,.65);
    padding:4px 7px;
    font-size:13px;
}

#subtitles{
    position:absolute;
    bottom:5%;
    left:5%;
    right:5%;
    text-align:center;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:clamp(13px,2vw,24px);
    text-shadow:
        2px 2px #000,
        -2px -2px #000,
        2px -2px #000,
        -2px 2px #000;
}

/* CONTROLS */

#controls{
    position:absolute;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);
    background:#151515;
    border:2px solid #333;
    border-radius:8px;
    padding:12px;
    text-align:center;
    z-index:20;
    box-shadow:0 8px 30px #000;
}

button{
    background:#252525;
    color:white;
    border:1px solid #666;
    border-radius:4px;
    padding:9px 15px;
    margin:3px;
    font-family:monospace;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#333;
}

#help{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

#warning{
    position:absolute;
    bottom:8px;
    left:10px;
    color:#555;
    font-size:11px;
}
</style>
</head>

<body>

<div id="room">

    <div id="floor"></div>

    <div id="tv">

        <div id="screen">

            <canvas id="canvas" width="800" height="450"></canvas>

            <div class="scanlines"></div>

            <div id="channelName">
                LOCAL NEWS
            </div>

            <div id="channelNumber">
                1
            </div>

            <div id="subtitles"></div>

        </div>

    </div>

    <div id="controls">

        <button onclick="previousChannel()">◀ PREVIOUS</button>

        <button onclick="nextChannel()">NEXT ▶</button>

        <button onclick="togglePause()" id="pauseButton">
            PAUSE
        </button>

        <div id="help">
            Arrow Keys / A-D = Change Channel
            &nbsp; | &nbsp;
            Space = Pause
        </div>

    </div>

    <div id="warning">
        THE TELEVISION SHOULD NOT BE TURNED ON THIS LATE.
    </div>

</div>


<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const subtitles =
    document.getElementById("subtitles");

const channelName =
    document.getElementById("channelName");

const channelNumber =
    document.getElementById("channelNumber");

let currentChannel = 0;

let startTime = performance.now();

let paused = false;


/* =========================================================
   CHANNEL LIST
========================================================= */

const channels = [

    {
        name:"LOCAL NEWS",
        draw:drawNews
    },

    {
        name:"KIDS' HOUR",
        draw:drawKids
    },

    {
        name:"OLD HORROR",
        draw:drawOldHorror
    },

    {
        name:"WEATHER",
        draw:drawWeather
    },

    {
        name:"COOKING HOUR",
        draw:drawCooking
    },

    {
        name:"NATURE",
        draw:drawNature
    },

    {
        name:"CHANNEL 13",
        draw:drawSecret
    }

];


/* =========================================================
   DRAWING HELPERS
========================================================= */

function background(color){

    ctx.fillStyle=color;

    ctx.fillRect(
        0,
        0,
        800,
        450
    );
}


function rectangle(x,y,w,h,color){

    ctx.fillStyle=color;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );
}


function text(
    words,
    x,
    y,
    size=30,
    align="left",
    color="#fff"
){

    ctx.font=
        "bold " +
        size +
        "px monospace";

    ctx.textAlign=align;

    ctx.fillStyle=color;

    ctx.fillText(
        words,
        x,
        y
    );
}


function line(
    x1,
    y1,
    x2,
    y2,
    color="#fff",
    width=2
){

    ctx.strokeStyle=color;

    ctx.lineWidth=width;

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.stroke();
}


/* =========================================================
   STATIC / TV NOISE
========================================================= */

function noise(amount=400){

    for(
        let i=0;
        i<amount;
        i++
    ){

        let gray=
            Math.floor(
                Math.random()*255
            );

        ctx.fillStyle=
            "rgba("+
            gray+
            ","+
            gray+
            ","+
            gray+
            ",.12)";

        ctx.fillRect(
            Math.random()*800,
            Math.random()*450,
            Math.random()*5+1,
            Math.random()*3+1
        );
    }
}


/* =========================================================
   CHANNEL 1
   LOCAL NEWS
========================================================= */

function drawNews(frame){

    background("#253942");

    rectangle(
        0,
        0,
        800,
        55,
        "#a51e24"
    );

    rectangle(
        0,
        330,
        800,
        120,
        "#141414"
    );

    text(
        "BREAKING NEWS",
        25,
        38,
        29
    );

    text(
        "CHANNEL 6",
        770,
        38,
        20,
        "right"
    );

    rectangle(
        80,
        100,
        640,
        190,
        "#3c4d53"
    );

    rectangle(
        110,
        125,
        270,
        140,
        "#56676b"
    );

    text(
        "LIVE",
        245,
        205,
        40,
        "center",
        "#ff3333"
    );

    text(
        "ANCHOR",
        245,
        240,
        20,
        "center"
    );

    line(
        420,
        175,
        690,
        175,
        "#777",
        4
    );

    line(
        420,
        210,
        650,
        210,
        "#777",
        4
    );

    line(
        420,
        245,
        610,
        245,
        "#777",
        4
    );

    if(frame>260){

        text(
            "WAIT...",
            400,
            300,
            22,
            "center"
        );

    }

}


/* =========================================================
   CHANNEL 2
   CREEPY KIDS SHOW
========================================================= */

function drawKids(frame){

    background("#71a6d3");

    /*
       SKY
    */

    ctx.fillStyle="#f5dc59";

    ctx.beginPath();

    ctx.arc(
        100,
        90,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       GRASS
    */

    rectangle(
        0,
        315,
        800,
        135,
        "#63a650"
    );


    /*
       HILLS
    */

    ctx.fillStyle="#467d45";

    ctx.beginPath();

    ctx.arc(
        150,
        330,
        180,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        650,
        340,
        220,
        Math.PI,
        0
    );

    ctx.fill();


    /*
       THE PUPPET
    */

    let bounce=
        Math.sin(frame*.08)*5;

    let px=400;
    let py=220+bounce;


    /*
       BODY
    */

    ctx.fillStyle="#d29a43";

    ctx.beginPath();

    ctx.arc(
        px,
        py,
        80,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       EYES
    */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        px-28,
        py-15,
        9,
        0,
        Math.PI*2
    );

    ctx.arc(
        px+28,
        py-15,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       SMILE
    */

    ctx.strokeStyle="#111";

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.arc(
        px,
        py-5,
        42,
        .2,
        Math.PI-.2
    );

    ctx.stroke();


    text(
        "HAPPY FRIENDS!",
        400,
        55,
        30,
        "center"
    );


    /*
       THE SHOW CHANGES
    */

    if(frame>220){

        text(
            "WHY ARE YOU STILL WATCHING?",
            400,
            395,
            20,
            "center"
        );

    }


    if(frame>340){

        /*
           eyes slowly move
        */

        ctx.fillStyle="#fff";

        ctx.fillRect(
            px-33,
            py-18,
            8,
            8
        );

        ctx.fillRect(
            px+23,
            py-18,
            8,
            8
        );

    }

}


/* =========================================================
   CHANNEL 3
   OLD HORROR MOVIE
========================================================= */

function drawOldHorror(frame){

    background("#101010");

    /*
       Old film tint
    */

    rectangle(
        0,
        0,
        800,
        450,
        "rgba(110,110,110,.08)"
    );


    /*
       OLD MOVIE TITLE
    */

    if(frame<100){

        text(
            "THE HOUSE",
            400,
            175,
            48,
            "center",
            "#ddd"
        );

        text(
            "ON BLACK HILL",
            400,
            225,
            28,
            "center",
            "#aaa"
        );

        text(
            "A MOTION PICTURE",
            400,
            270,
            16,
            "center",
            "#777"
        );

        return;
    }


    /*
       MOON
    */

    ctx.fillStyle="#ddd";

    ctx.beginPath();

    ctx.arc(
        640,
        90,
        48,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       SKY
    */

    rectangle(
        0,
        280,
        800,
        170,
        "#090909"
    );


    /*
       HOUSE
    */

    rectangle(
        230,
        175,
        340,
        175,
        "#171717"
    );


    /*
       ROOF
    */

    ctx.fillStyle="#090909";

    ctx.beginPath();

    ctx.moveTo(190,180);
    ctx.lineTo(400,60);
    ctx.lineTo(610,180);
    ctx.closePath();

    ctx.fill();


    /*
       WINDOWS
    */

    rectangle(
        285,
        220,
        55,
        65,
        "#252525"
    );

    rectangle(
        460,
        220,
        55,
        65,
        "#252525"
    );


    /*
       DOOR
    */

    rectangle(
        365,
        245,
        70,
        105,
        "#0c0c0c"
    );


    /*
       STRANGE FIGURE
    */

    if(frame>180){

        let progress=
            Math.min(
                1,
                (frame-180)/500
            );

        let size=
            15+
            progress*60;

        let x=400;

        let y=
            205+
            progress*55;


        /*
           head
        */

        ctx.fillStyle="#050505";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size*.45,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           body
        */

        rectangle(
            x-size*.5,
            y+size*.3,
            size,
            size*1.8,
            "#050505"
        );


        /*
           eyes
        */

        if(frame>300){

            ctx.fillStyle="#eee";

            ctx.fillRect(
                x-size*.2,
                y-size*.05,
                7,
                4
            );

            ctx.fillRect(
                x+size*.1,
                y-size*.05,
                7,
                4
            );

        }

    }


    /*
       OLD FILM SCRATCHES
    */

    if(Math.random()<.15){

        line(
            Math.random()*800,
            0,
            Math.random()*800,
            450,
            "#aaa",
            1
        );

    }

}


/* =========================================================
   CHANNEL 4
   WEATHER
========================================================= */

function drawWeather(frame){

    background("#72a3c1");

    rectangle(
        0,
        320,
        800,
        130,
        "#2d6d42"
    );


    for(let i=0;i<5;i++){

        let x=
            ((i*180-frame*.12)%900)-100;

        ctx.fillStyle="#eee";

        ctx.beginPath();

        ctx.arc(
            x,
            130,
            40,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+45,
            120,
            50,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+90,
            135,
            38,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    text(
        "TONIGHT",
        400,
        55,
        30,
        "center",
        "#102832"
    );

    text(
        "67°",
        400,
        270,
        70,
        "center"
    );


    if(frame>190){

        text(
            "SOMETHING IS MOVING IN.",
            400,
            375,
            20,
            "center"
        );

    }

}


/* =========================================================
   CHANNEL 5
   COOKING
========================================================= */

function drawCooking(frame){

    background("#d2bea0");

    rectangle(
        0,
        340,
        800,
        110,
        "#654128"
    );

    rectangle(
        200,
        100,
        400,
        230,
        "#b57c4d"
    );

    rectangle(
        240,
        135,
        320,
        160,
        "#eee"
    );

    text(
        "COOKING HOUR",
        400,
        65,
        30,
        "center",
        "#4b2b1b"
    );

    text(
        "TODAY: SOUP",
        400,
        105,
        20,
        "center",
        "#4b2b1b"
    );


    /*
       Bowl
    */

    ctx.fillStyle="#888";

    ctx.beginPath();

    ctx.ellipse(
        400,
        275,
        130,
        55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#694727";

    ctx.beginPath();

    ctx.ellipse(
        400,
        260,
        110,
        42,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Steam
    */

    for(let i=0;i<5;i++){

        let wiggle=
            Math.sin(
                frame*.05+i
            )*5;

        line(
            350+i*25,
            210,
            360+i*20+wiggle,
            175,
            "#fff",
            3
        );

    }


    if(frame>260){

        text(
            "KEEP STIRRING.",
            400,
            395,
            21,
            "center",
            "#4b2b1b"
        );

    }

}


/* =========================================================
   CHANNEL 6
   NATURE
========================================================= */

function drawNature(frame){

    background("#1b422d");

    rectangle(
        0,
        315,
        800,
        135,
        "#0c2516"
    );


    /*
       Trees
    */

    for(let i=0;i<18;i++){

        let x=
            i*48+
            (frame*.08%48);

        let height=
            80+
            (i%5)*18;

        line(
            x,
            335,
            x-12,
            335-height,
            "#4d8b55",
            5
        );

        line(
            x,
            335,
            x+18,
            335-height*.7,
            "#4d8b55",
            5
        );

    }


    /*
       Strange dark tree
    */

    ctx.fillStyle="#080808";

    ctx.beginPath();

    ctx.ellipse(
        610,
        260,
        45,
        90,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    text(
        "NATURE WATCH",
        30,
        45,
        28
    );

    text(
        "FOREST CAM 04",
        770,
        45,
        18,
        "right"
    );


    if(frame>210){

        text(
            "DID THAT TREE MOVE?",
            400,
            390,
            21,
            "center"
        );

    }

}


/* =========================================================
   CHANNEL 7
   SECRET HORROR CHANNEL
========================================================= */

function drawSecret(frame){

    background("#020202");


    /*
       Hallway
    */

    rectangle(
        150,
        50,
        500,
        400,
        "#080808"
    );


    line(
        150,
        50,
        400,
        205,
        "#222",
        5
    );

    line(
        650,
        50,
        400,
        205,
        "#222",
        5
    );

    line(
        150,
        450,
        400,
        205,
        "#222",
        5
    );

    line(
        650,
        450,
        400,
        205,
        "#222",
        5
    );


    /*
       Figure slowly gets closer
    */

    if(frame>50){

        let progress=
            Math.min(
                1,
                (frame-50)/600
            );

        let size=
            15+
            progress*75;

        let x=400;

        let y=
            180+
            progress*90;


        ctx.fillStyle="#030303";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size*.45,
            0,
            Math.PI*2
        );

        ctx.fill();


        rectangle(
            x-size*.5,
            y+size*.25,
            size,
            size*2,
            "#030303"
        );


        if(frame>180){

            ctx.fillStyle="#eee";

            ctx.fillRect(
                x-size*.2,
                y,
                7,
                5
            );

            ctx.fillRect(
                x+size*.1,
                y,
                7,
                5
            );

        }

    }


    /*
       Glitch
    */

    if(frame>400){

        for(let i=0;i<10;i++){

            rectangle(
                Math.random()*800,
                Math.random()*450,
                Math.random()*200,
                Math.random()*8,
                "#ddd"
            );

        }

    }


    if(frame>520){

        rectangle(
            0,
            0,
            800,
            450,
            "#eee"
        );

        if(frame%3===0){

            background("#000");

        }

    }


    if(frame>550){

        text(
            "TURN AROUND.",
            400,
            390,
            30,
            "center"
        );

    }

}


/* =========================================================
   SUBTITLES
========================================================= */

function updateSubtitles(frame){

    let words="";


    if(currentChannel===0){

        if(frame<240)
            words=
            "We now return to our regularly scheduled program.";

        else
