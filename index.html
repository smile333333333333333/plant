<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TV NIGHT</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#070707;
color:white;
font-family:monospace;
overflow:hidden;
}

#room{
width:100vw;
height:100vh;
background:
linear-gradient(#191919 0 68%,#0d0d0d 68%);
position:relative;
}

#floor{
position:absolute;
bottom:0;
width:100%;
height:32%;
background:
repeating-linear-gradient(
90deg,
#111 0px,
#111 80px,
#0a0a0a 81px,
#0a0a0a 160px
);
}

#tv{
position:absolute;
left:50%;
top:6%;
transform:translateX(-50%);
width:min(850px,92vw);
height:min(520px,62vh);
background:#1c1c1c;
border:20px solid #111;
border-radius:20px;
box-shadow:
0 25px 60px #000,
inset 0 0 0 4px #333;
}

#screen{
position:absolute;
inset:12px;
background:#000;
overflow:hidden;
}

canvas{
width:100%;
height:100%;
display:block;
}

.scanlines{
position:absolute;
inset:0;
pointer-events:none;
background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.035) 0px,
rgba(255,255,255,.035) 1px,
transparent 2px,
transparent 4px
);
}

#channel{
position:absolute;
top:8px;
right:8px;
background:rgba(0,0,0,.7);
padding:5px;
font-size:17px;
}

#name{
position:absolute;
top:8px;
left:8px;
background:rgba(0,0,0,.7);
padding:5px;
font-size:13px;
}

#subs{
position:absolute;
bottom:5%;
left:5%;
right:5%;
text-align:center;
font-family:Arial,sans-serif;
font-size:clamp(14px,2vw,23px);
font-weight:bold;
text-shadow:
2px 2px black,
-2px -2px black,
2px -2px black,
-2px 2px black;
}

#controls{
position:absolute;
bottom:5%;
left:50%;
transform:translateX(-50%);
background:#151515;
border:2px solid #333;
padding:12px;
border-radius:8px;
text-align:center;
z-index:10;
}

button{
background:#292929;
color:white;
border:1px solid #666;
padding:9px 15px;
margin:3px;
font-family:monospace;
font-weight:bold;
border-radius:4px;
}

#help{
color:#888;
font-size:11px;
margin-top:5px;
}

#message{
position:absolute;
bottom:8px;
left:10px;
color:#555;
font-size:11px;
}
</style>
</head>

<body>

<div id="room">

<div id="floor"></div>

<div id="tv">

<div id="screen">

<canvas id="canvas" width="800" height="450"></canvas>

<div class="scanlines"></div>

<div id="name">LOCAL NEWS</div>

<div id="channel">1</div>

<div id="subs"></div>

</div>

</div>

<div id="controls">

<button onclick="previousChannel()">◀ PREVIOUS</button>

<button onclick="nextChannel()">NEXT ▶</button>

<button onclick="togglePause()" id="pause">
PAUSE
</button>

<div id="help">
← / → or A / D = channels &nbsp; | &nbsp; SPACE = pause
</div>

</div>

<div id="message">
THE TV WASN'T ON WHEN YOU SAT DOWN.
</div>

</div>


<script>

/* =====================================================
SETUP
===================================================== */

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

const nameDisplay=document.getElementById("name");

const channelDisplay=document.getElementById("channel");

const subtitles=document.getElementById("subs");

const pauseButton=document.getElementById("pause");

let channel=0;

let frame=0;

let lastFrame=performance.now();

let paused=false;


/* =====================================================
HELPERS
===================================================== */

function bg(color){
ctx.fillStyle=color;
ctx.fillRect(0,0,800,450);
}

function rect(x,y,w,h,color){
ctx.fillStyle=color;
ctx.fillRect(x,y,w,h);
}

function text(str,x,y,size=30,color="white",align="left"){
ctx.fillStyle=color;
ctx.font="bold "+size+"px monospace";
ctx.textAlign=align;
ctx.fillText(str,x,y);
}

function circle(x,y,r,color){
ctx.fillStyle=color;
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fill();
}

function line(x1,y1,x2,y2,color="white",width=2){
ctx.strokeStyle=color;
ctx.lineWidth=width;
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();
}

function staticNoise(amount=500){

for(let i=0;i<amount;i++){

let c=Math.floor(Math.random()*255);

ctx.fillStyle=
"rgba("+c+","+c+","+c+",.15)";

ctx.fillRect(
Math.random()*800,
Math.random()*450,
Math.random()*5,
Math.random()*3
);

}

}


/* =====================================================
CHANNEL 1
NEWS
===================================================== */

function newsFrame(f){

bg("#263942");

rect(0,0,800,55,"#a82020");

text(
"BREAKING NEWS",
25,
38,
29
);

text(
"LOCAL 6",
770,
38,
20,
"white",
"right"
);

rect(
80,
100,
640,
190,
"#43545a"
);

rect(
110,
125,
270,
140,
"#66777a"
);

text(
"LIVE",
245,
210,
42,
"#ff3333",
"center"
);

text(
"ANCHOR",
245,
245,
18,
"white",
"center"
);

line(
420,
175,
690,
175,
"#888",
4
);

line(
420,
215,
650,
215,
"#888",
4
);

line(
420,
255,
600,
255,
"#888",
4
);

rect(
0,
335,
800,
115,
"#151515"
);

if(f>5){

text(
"Good evening.",
400,
390,
25,
"white",
"center"
);

}

if(f>10){

text(
"We interrupt this program.",
400,
390,
25,
"white",
"center"
);

}

if(f>15){

text(
"Something unusual has been reported.",
400,
390,
23,
"white",
"center"
);

}

}


/* =====================================================
CHANNEL 2
KIDS SHOW
===================================================== */

function kidsFrame(f){

bg("#76b6e5");

/* SUN */

circle(
110,
90,
45,
"#ffe66b"
);

/* GRASS */

rect(
0,
315,
800,
135,
"#65a94f"
);

/* CLOUDS */

circle(300,90,35,"white");
circle(345,90,45,"white");
circle(390,95,30,"white");

circle(600,125,30,"white");
circle(635,120,40,"white");


/* HOUSE */

rect(
80,
210,
170,
120,
"#df704c"
);

ctx.fillStyle="#8d3c35";

ctx.beginPath();

ctx.moveTo(60,210);
ctx.lineTo(165,130);
ctx.lineTo(270,210);
ctx.closePath();

ctx.fill();

rect(
140,
260,
45,
70,
"#653d32"
);


/* CHARACTER */

let x=500;

let y=220;

if(f===1)y=210;

if(f===2)y=225;

if(f===3)y=205;

if(f===4)y=230;

if(f===5)y=215;

if(f===6)y=220;

if(f===7)y=205;

if(f===8)y=225;


/* HEAD */

circle(
x,
y,
75,
"#e6a848"
);


/* EYES */

circle(
x-27,
y-15,
9,
"#111"
);

circle(
x+27,
y-15,
9,
"#111"
);


/* MOUTH CHANGES EACH FRAME */

ctx.strokeStyle="#111";
ctx.lineWidth=6;

ctx.beginPath();

if(f%2===0){

ctx.arc(
x,
y+5,
35,
0,
Math.PI
);

}else{

ctx.arc(
x,
y-5,
25,
0,
Math.PI
);

}

ctx.stroke();


text(
"HAPPY FRIENDS!",
400,
50,
30,
"white",
"center"
);


/* FRAME EVENTS */

if(f>=9){

text(
"HELLO!",
500,
380,
28,
"white",
"center"
);

}

if(f>=12){

text(
"HELLO, VIEWER!",
500,
380,
25,
"white",
"center"
);

}

if(f>=15){

text(
"YOU'RE STILL THERE.",
400,
390,
22,
"white",
"center"
);

}

}


/* =====================================================
CHANNEL 3
OLD HORROR
===================================================== */

function horrorFrame(f){

bg("#111");

if(f===0){

text(
"AN OLD HORROR PICTURE",
400,
180,
32,
"#ddd",
"center"
);

text(
"THE HOUSE ON BLACK HILL",
400,
230,
28,
"#aaa",
"center"
);

text(
"1937",
400,
280,
20,
"#888",
"center"
);

return;

}


/* SKY */

bg("#151515");

circle(
650,
90,
50,
"#ddd"
);


/* GROUND */

rect(
0,
330,
800,
120,
"#080808"
);


/* HOUSE */

rect(
230,
180,
340,
170,
"#171717"
);


/* ROOF */

ctx.fillStyle="#080808";

ctx.beginPath();

ctx.moveTo(180,180);

ctx.lineTo(400,55);

ctx.lineTo(620,180);

ctx.closePath();

ctx.fill();


/* WINDOWS */

rect(
285,
220,
55,
65,
"#050505"
);

rect(
460,
220,
55,
65,
"#050505"
);


/* DOOR */

rect(
365,
245,
70,
105,
"#050505"
);


/* FRAME-BY-FRAME LIGHT */

if(f===2){

rect(
285,
220,
55,
65,
"#ddd"
);

}

if(f===3){

rect(
460,
220,
55,
65,
"#ddd"
);

}

if(f===4){

rect(
285,
220,
55,
65,
"#050505"
);

rect(
460,
220,
55,
65,
"#050505"
);

}


/* FIGURE APPEARS */

if(f>=5){

let size=25;

if(f>=7)size=32;

if(f>=9)size=40;

if(f>=11)size=50;

if(f>=13)size=65;

let y=190;

if(f>=7)y=205;

if(f>=9)y=220;

if(f>=11)y=240;

if(f>=13)y=260;


/* HEAD */

circle(
400,
y,
size*.45,
"#050505"
);


/* BODY */

rect(
400-size*.5,
y+size*.3,
size,
size*1.8,
"#050505"
);


/* EYES */

if(f>=9){

rect(
385,
y-2,
8,
5,
"#ddd"
);

rect(
407,
y-2,
8,
5,
"#ddd"
);

}

}


/* FILM SCRATCH */

if(f%3===0){

line(
Math.random()*800,
0,
Math.random()*800,
450,
"#777",
1
);

}


/* END */

if(f>=17){

text(
"DO NOT OPEN THE DOOR.",
400,
395,
23,
"#fff",
"center"
);

}

}


/* =====================================================
CHANNEL 4
WEATHER
===================================================== */

function weatherFrame(f){

bg("#75a7c3");

rect(
0,
320,
800,
130,
"#2e6d43"
);

circle(
110,
100,
50,
"#ffe06a"
);


/* CLOUD FRAME MOVEMENT */

let x=200+f*10;

if(x>900)x=-150;

circle(x,140,40,"white");

circle(x+45,130,50,"white");

circle(x+90,145,38,"white");

text(
"TONIGHT'S FORECAST",
400,
55,
28,
"#102b35",
"center"
);

text(
"67°",
400,
270,
75,
"white",
"center"
);

if(f>=6){

text(
"WAIT...",
400,
375,
25,
"white",
"center"
);

}

if(f>=10){

text(
"THAT ISN'T A CLOUD.",
400,
375,
23,
"white",
"center"
);

}

}


/* =====================================================
CHANNEL 5
COOKING
===================================================== */

function cookingFrame(f){

bg("#d3bea0");

rect(
0,
340,
800,
110,
"#654127"
);

rect(
220,
110,
360,
220,
"#b97c4b"
);

rect(
255,
145,
290,
145,
"#eee"
);

text(
"COOKING HOUR",
400,
60,
30,
"#4d2d1b",
"center"
);

text(
"TODAY: SOUP",
400,
100,
21,
"#4d2d1b",
"center"
);


/* BOWL */

ctx.fillStyle="#888";

ctx.beginPath();

ctx.ellipse(
400,
270,
130,
55,
0,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#684629";

ctx.beginPath();

ctx.ellipse(
400,
255,
108,
42,
0,
0,
Math.PI*2
);

ctx.fill();


/* STEAM */

for(let i=0;i<5;i++){

let wave=
Math.sin(
f*.5+i
)*5;

line(
350+i*25,
210,
360+i*20+wave,
175,
"white",
3
);

}


if(f>=8){

text(
"KEEP STIRRING.",
400,
395,
23,
"#4d2d1b",
"center"
);

}

}


/* =====================================================
CHANNEL 6
NATURE
===================================================== */

function natureFrame(f){

bg("#1c462e");

rect(
0,
315,
800,
135,
"#0d2417"
);


/* TREES */

for(let i=0;i<15;i++){

let x=i*60;

let h=70+(i%4)*20;

line(
x,
335,
x,
335-h,
"#558c58",
7
);

line(
x,
290,
x-25,
260,
"#558c58",
4
);

line(
x,
280,
x+25,
250,
"#558c58",
4
);

}


/* DARK TREE */

let treeX=600;

if(f>=5)treeX=590;

if(f>=8)treeX=570;

if(f>=11)treeX=540;

if(f>=14)treeX=510;

rect(
treeX-8,
190,
16,
150,
"#050505"
);

circle(
treeX,
170,
65,
"#050505"
);


text(
"NATURE WATCH",
25,
45,
28
);

text(
"FOREST CAM 04",
770,
45,
18,
"white",
"right"
);


if(f>=6){

text(
"Something moved.",
400,
390,
22,
"white",
"center"
);

}

}


/* =====================================================
CHANNEL 7
SECRET CHANNEL
===================================================== */

function secretFrame(f){

bg("#020202");


/* HALLWAY */

rect(
150,
50,
500,
400,
"#080808"
);

line(
150,
50,
400,
210,
"#222",
5
);

line(
650,
50,
400,
210,
"#222",
5
);

line(
150,
450,
400,
210,
"#222",
5
);

line(
650,
450,
400,
210,
"#222",
5
);


/* EMPTY FRAMES */

if(f<=3){

text(
"CHANNEL 13",
400,
120,
30,
"#aaa",
"center"
);

text(
"NO SIGNAL",
400,
250,
45,
"#555",
"center"
);

return;

}


/* FIGURE */

let size=20;

let y=180;

if(f===5){

size=25;
y=185;

}

if(f===6){

size=30;
y=195;

}

if(f===7){

size=38;
y=205;

}

if(f===8){

size=47;
y=220;

}

if(f===9){

size=60;
y=240;

}

if(f>=10){

size=75;
y=270;

}


/* HEAD */

circle(
400,
y,
size*.45,
"#030303"
);


/* BODY */

rect(
400-size*.5,
y+size*.3,
size,
size*2,
"#030303"
);


/* EYES */

if(f>=7){

rect(
383,
y-2,
8,
5,
"#eee"
);

rect(
409,
y-2,
8,
5,
"#eee"
);

}


/* GLITCH */

if(f>=11){

for(let i=0;i<15;i++){

rect(
Math.random()*800,
Math.random()*450,
Math.random()*150,
Math.random()*5,
"#aaa"
);

}

}


if(f>=14){

bg("#eee");

}

if(f>=15){

bg("#000");

text(
"TURN AROUND.",
400,
390,
30,
"white",
"center"
);

}

}


/* =====================================================
CHANNEL DATA
===================================================== */

const channelNames=[
"LOCAL NEWS",
"KIDS' HOUR",
"OLD HORROR",
"WEATHER",
"COOKING HOUR",
"NATURE",
"CHANNEL 13"
];

const channelFunctions=[
newsFrame,
kidsFrame,
horrorFrame,
weatherFrame,
cookingFrame,
natureFrame,
secretFrame
];


/* =====================================================
SUBTITLES
===================================================== */

function updateSubtitles(f){

let s="";


if(channel===0){

if(f<10)
s="ANCHOR: Good evening.";

else if(f<15)
s="ANCHOR: We interrupt this program.";

else
s="ANCHOR: Something unusual has been reported.";

}


if(channel===1){

if(f<9)
s="HOST: Welcome back, everybody!";

else if(f<12)
s="PUPPET: Hello, viewer!";

else if(f<15)
s="PUPPET: You're still there.";

else
s="PUPPET: Why are you still watching?";

}


if(channel===2){

if(f===0)
s="A long time ago...";

else if(f<5)
s="NARRATOR: This house has been empty for years.";

else if(f<9)
s="NARRATOR: Nobody lives here anymore.";

else if(f<13)
s="NARRATOR: At least... nobody human.";

else
s="NARRATOR: DO NOT OPEN THE DOOR.";

}


if(channel===3){

if(f<6)
s="WEATHER REPORTER: Clear skies tonight.";

else if(f<10)
s="WEATHER REPORTER: Wait...";

else
s="WEATHER REPORTER: That isn't a cloud.";

}


if(channel===4){

if(f<8)
s="CHEF: Today we're making soup.";

else
s="CHEF: Keep stirring.";

}


if(channel===5){

if(f<6)
s="NARRATOR: The forest is unusually quiet.";

else
s="NARRATOR: Something moved.";

}


if(channel===6){

if(f<4)
s="";

else if(f<7)
s="VOICE: Is anyone watching?";

else if(f<11)
s="VOICE: You should not be watching this.";

else if(f<14)
s="VOICE: CHANGE THE CHANNEL.";

else
s="VOICE: TURN AROUND.";

}


subtitles.textContent=s;

}


/* =====================================================
CHANNEL SWITCHING
===================================================== */

function nextChannel(){

channel++;

if(channel>=channelFunctions.length){

channel=0;

}

frame=0;

lastFrame=performance.now();

}


function previousChannel(){

channel--;

if(channel<0){

channel=
channelFunctions.length-1;

}

frame=0;

lastFrame=performance.now();

}


/* =====================================================
PAUSE
===================================================== */

function togglePause(){

paused=!paused;

pauseButton.textContent=
paused ? "PLAY" : "PAUSE";

}


/* =====================================================
KEYBOARD
===================================================== */

document.addEventListener(
"keydown",
function(e){

if(
e.key==="ArrowRight" ||
e.key.toLowerCase()==="d"
){

nextChannel();

}

if(
e.key==="ArrowLeft" ||
e.key.toLowerCase()==="a"
){

previousChannel();

}

if(e.key===" "){

e.preventDefault();

togglePause();

}

});


/* =====================================================
VIDEO PLAYER
===================================================== */

function loop(time){

if(!paused){

/*
One coded frame every ~170ms.
That makes the changes obvious instead of
trying to animate everything continuously.
*/

if(
time-lastFrame>=170
){

frame++;

lastFrame=time;

}

channelFunctions[channel](frame);

updateSubtitles(frame);

nameDisplay.textContent=
channelNames[channel];

channelDisplay.textContent=
channel+1;


/*
Restart the current "video" after its frames.
*/

let maxFrames=18;

if(
channel===0
)maxFrames=20;

if(
channel===1
)maxFrames=20;

if(
channel===2
)maxFrames=18;

if(
channel===3
)maxFrames=16;

if(
channel===4
)maxFrames=16;

if(
channel===5
)maxFrames=17;

if(
channel===6
)maxFrames=18;


if(frame>maxFrames){

frame=0;

}


/*
Occasional TV static.
*/

if(
Math.random()<.025
){

staticNoise(300);

}

}

requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>

</body>
