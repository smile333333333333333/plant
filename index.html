<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREENHOUSE: NIGHT SHIFT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07100a;color:#d9f5d0;font-family:monospace;min-height:100vh}
#game{max-width:900px;margin:auto;padding:18px}
h1{color:#8cff72;text-align:center;letter-spacing:4px;margin:8px 0}
.subtitle{text-align:center;color:#71946b;margin-bottom:18px}
.panel{background:#0d1a10;border:2px solid #294c2b;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 0 20px #000}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#071009;padding:10px;text-align:center;border:1px solid #203923}
.stat b{display:block;color:#8cff72;font-size:18px}
#plants{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.plant{background:#102015;border:2px solid #315b34;border-radius:8px;padding:12px}
.plant.dying{border-color:#805050}
.plant h3{margin:0 0 8px;color:#a9ff91}
.bar{height:12px;background:#050805;border:1px solid #315b34;margin:5px 0 10px}
.fill{height:100%;background:#62bd59}
button{background:#18351c;color:#d9f5d0;border:1px solid #5a9c5c;padding:9px;margin:3px;border-radius:5px;font-family:monospace;cursor:pointer}
button:hover{background:#28552d}
button:disabled{opacity:.35;cursor:not-allowed}
#log{height:170px;overflow:auto;background:#030604;padding:10px;border:1px solid #263d28;color:#a9c8a3}
.logline{margin:0 0 6px}
.warning{color:#ff8b6b}
.good{color:#8cff72}
#message{min-height:28px;color:#d8ffcf;text-align:center}
#ending{display:none;text-align:center;padding:25px}
.big{font-size:28px;color:#8cff72}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>
<div id="game">

<h1>GREENHOUSE: NIGHT SHIFT</h1>
<div class="subtitle">
Take care of the plants. Do not let them take care of you.
</div>

<div class="panel">
<div class="stats">
<div class="stat">DAY<b id="day">1</b></div>
<div class="stat">TIME<b id="time">8:00 PM</b></div>
<div class="stat">WATER<b id="water">6</b></div>
<div class="stat">HEALTH<b id="health">100%</b></div>
</div>
</div>

<div id="message"></div>

<div class="panel">
<h2>🌱 PLANTS</h2>
<div id="plants"></div>
</div>

<div class="panel">
<h2>🛠 ACTIONS</h2>

<button onclick="advanceTime()">
Wait 1 Hour
</button>

<button onclick="inspectGreenhouse()">
Inspect Greenhouse
</button>

<button onclick="lockDoor()">
Check Door
</button>

<button onclick="sleepUntilMorning()">
Sleep Until Morning
</button>

</div>

<div class="panel">
<h2>📋 NIGHT LOG</h2>
<div id="log"></div>
</div>

<div id="ending" class="panel">
<div class="big" id="endingTitle"></div>
<p id="endingText"></p>
<button onclick="location.reload()">Start Over</button>
</div>

</div>

<script>

const plants = [

{
name:"Fern",
water:72,
growth:20,
strange:0
},

{
name:"Moonflower",
water:55,
growth:35,
strange:0
},

{
name:"Little Vine",
water:80,
growth:10,
strange:0
},

{
name:"Unknown Plant",
water:45,
growth:5,
strange:0
}

];

let day=1;
let hour=20;
let water=6;
let health=100;
let doorLocked=false;
let ended=false;
let eventCounter=0;


function log(text,cls=""){

const p=document.createElement("p");

p.className="logline "+cls;

p.textContent="["+formatTime()+"] "+text;

document.getElementById("log").prepend(p);

}


function formatTime(){

let h=hour%24;

let suffix=h>=12?"PM":"AM";

let display=h%12||12;

return display+":00 "+suffix;

}


function render(){

document.getElementById("day").textContent=day;

document.getElementById("time").textContent=formatTime();

document.getElementById("water").textContent=water;

document.getElementById("health").textContent=health+"%";


const box=document.getElementById("plants");

box.innerHTML="";


plants.forEach((p,i)=>{

let cls=p.water<20?"dying":"";

box.innerHTML+=`

<div class="plant ${cls}">

<h3>${p.name}</h3>

<div>Water</div>

<div class="bar">

<div class="fill"
style="width:${Math.max(0,p.water)}%">
</div>

</div>

<div>Growth: ${p.growth}%</div>

<div>Strangeness: ${p.strange}</div>

<button onclick="waterPlant(${i})"
${water<=0?"disabled":""}>
💧 Water
</button>

<button onclick="talkPlant(${i})">
🗣 Talk
</button>

</div>

`;

});

if(health<=0){

endGame(false);

}

}


function message(t,cls=""){

let m=document.getElementById("message");

m.textContent=t;

m.className=cls;

}


function waterPlant(i){

if(ended)return;

if(water<=0){

message("The watering can is empty.","warning");

return;

}

water--;

plants[i].water=Math.min(
100,
plants[i].water+35
);

plants[i].growth+=4;

log(
"You watered the "+plants[i].name+".",
"good"
);


if(
plants[i].name==="Unknown Plant"
&&
Math.random()<.35
){

plants[i].strange++;

log(
"The Unknown Plant moved when you weren't looking.",
"warning"
);

}

render();

}


function talkPlant(i){

if(ended)return;

const p=plants[i];

const normal=[

"The leaves rustle softly.",

"Nothing happens.",

"You hear the greenhouse fan.",

"The plant smells like fresh soil."

];

let text=
normal[Math.floor(Math.random()*normal.length)];


if(p.strange>=2){

text=
"Something rustles from inside the soil.";

}


if(
p.name==="Unknown Plant"
&&
p.strange>=3
){

text="It whispers your name.";

}


log(
text,
p.strange>=2?"warning":""
);

message(text);

}


function advanceTime(){

if(ended)return;

hour++;

eventCounter++;


plants.forEach(p=>{

p.water=Math.max(
0,
p.water-7
);

if(p.water>30){

p.growth=Math.min(
100,
p.growth+2
);

}

if(p.water<20){

p.growth=Math.max(
0,
p.growth-1
);

}

});


randomEvent();


if(hour>=24){

hour=0;

day++;

morningCheck();

}


render();

}


function randomEvent(){

let r=Math.random();


if(r<.18){

log(
"You hear something scraping against the greenhouse glass.",
"warning"
);

message(
"Something is outside."
);

health-=5;


}

else if(r<.30){

log(
"A pot has been moved."
);

plants[
Math.floor(
Math.random()*plants.length
)
].strange++;


}

else if(r<.39){

log(
"The lights flicker."
);

message(
"The lights flicker... then come back."
);


}

else if(r<.47){

log(
"You hear leaves moving behind you.",
"warning"
);

health-=3;

}


if(
eventCounter>=5
&&
Math.random()<.5
){

plants[3].strange++;

log(
"The Unknown Plant has grown while you weren't watching.",
"warning"
);

}

}


function inspectGreenhouse(){

if(ended)return;


const p=plants[3];


if(p.strange>=3){

log(
"The Unknown Plant is facing the door. It wasn't before.",
"warning"
);

message(
"You suddenly don't want to turn around.",
"warning"
);


}

else{

log(
"Everything looks normal... mostly."
);

message(
"The greenhouse looks quiet."
);

}

}


function lockDoor(){

doorLocked=!doorLocked;


log(
doorLocked
?
"You locked the greenhouse door."
:
"You unlocked the greenhouse door."
);


message(
doorLocked
?
"The lock clicks shut."
:
"The door is unlocked."
);


if(
!doorLocked
&&
plants[3].strange>=4
){

log(
"Something touched the door handle.",
"warning"
);

health-=10;

}


render();

}


function sleepUntilMorning(){

if(ended)return;


while(hour!==6){

hour++;

plants.forEach(p=>{

p.water=Math.max(
0,
p.water-7
);

});


if(hour>=24){

hour=0;

day++;

morningCheck();

if(ended)return;

}

}


log(
"You made it to 6:00 AM.",
"good"
);

render();

}


function morningCheck(){

log(
"Morning arrives."
);


if(plants[3].strange>=5){

endGame(true);

}

else{

log(
"You survived another night.",
"good"
);

water=Math.min(
8,
water+3
);

message(
"The sun is coming up. You survived."
);

}

}


function endGame(win){

ended=true;

document.getElementById(
"ending"
).style.display="block";


if(win){

document.getElementById(
"endingTitle"
).textContent="🌿 IT GREW";


document.getElementById(
"endingText"
).textContent=
"You kept watering it. You kept checking on it. You should have stopped. By morning, the Unknown Plant had grown all the way to the ceiling—and something inside it was breathing.";


log(
"GAME OVER: The greenhouse is no longer yours.",
"warning"
);


}

else{

document.getElementById(
"endingTitle"
).textContent="THE GREENHOUSE";


document.getElementById(
"endingText"
).textContent=
"You couldn't keep yourself together long enough to finish the night.";

}

}


log(
"Night 1 begins. The owner said the plants only need water."
);

log(
"They specifically said not to touch the Unknown Plant."
);

render();

</script>

</body>
</html>
